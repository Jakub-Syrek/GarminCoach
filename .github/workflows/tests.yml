name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore GarminCoach/GarminCoach.csproj
          dotnet restore GarminCoach.Tests/GarminCoach.Tests.csproj

      - name: Build app
        run: dotnet build GarminCoach/GarminCoach.csproj --configuration Release --no-restore /p:NoWarn=NU1701

      - name: Build tests
        run: dotnet build GarminCoach.Tests/GarminCoach.Tests.csproj --configuration Release --no-restore /p:NoWarn=NU1701

      - name: Test
        run: dotnet test GarminCoach.Tests/GarminCoach.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
